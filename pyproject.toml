# agy-mcp：把本机 Antigravity CLI（agy）接成 MCP 服务器。
#
# 说明：
# - 依赖为零（纯标准库），所以把源码目录直接给客户端跑也能用；这个文件主要提供
#   项目元数据、把版本号单一来源指到 core/config.py，以及 pip install 时的 console_scripts。
# - 老客户端配置里写的是 `python3 .../agy_mcp.py`，那条路按仓库内运行，不经过 pip。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-mcp"
dynamic = ["version"]
description = "把本机 Antigravity CLI（agy）接成 MCP 服务器：用已有账号额度提问、读仓库、跑 agent，凭据不出本机。"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "agy-mcp contributors" }]
keywords = ["mcp", "antigravity", "agy", "codex", "claude", "gemini", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
# 运行期零第三方依赖
dependencies = []

[project.optional-dependencies]
# 3.9 / 3.10 没有标准库 tomllib，注册脚本要用到
tomli = ["tomli>=2.0; python_version < '3.11'"]

[project.scripts]
agy-mcp = "core.server:run"
agy-mcp-register = "register_agy_mcp:main"

[project.urls]
Homepage = "https://github.com/lhdhtrc/agy-mcp"
Releases = "https://github.com/lhdhtrc/agy-mcp/releases"

[tool.setuptools]
packages = ["core", "hooks"]
# 注册脚本按模块发布（console_scripts 用它）；main.py / agy_mcp.py 是仓库内的入口脚本，
# 名字太通用，不装进 site-packages。
py-modules = ["register_agy_mcp"]

[tool.setuptools.dynamic]
# 版本号只维护一处：core/config.py 的 SERVER_VERSION
version = { attr = "core.config.SERVER_VERSION" }
