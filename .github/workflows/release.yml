name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tagged commit
        run: |
          python -m compileall -q core hooks main.py agy_mcp.py register_agy_mcp.py test_agy_mcp.py
          python test_agy_mcp.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep it idempotent: a release may already exist for this tag.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
